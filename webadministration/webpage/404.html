<!DOCTYPE html>
<html lang="en">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found. Return to the TWG-FAS website.">
  <link rel="canonical" href="https://twg-fas.org/">
  <title>404 – Page Not Found | TWG-FAS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #0a1628;
      --navy2:  #0f2040;
      --blue:   #1a3a6b;
      --accent: #2e6be6;
      --accent2:#4a9eff;
      --text:   #e8edf5;
      --muted:  #8fa3bf;
      --border: #1e3a5a;
      --card:   #0d1e38;
      --white:  #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--navy);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      background: rgba(10,22,40,0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    nav .brand { font-size: 0.9rem; font-weight: 600; color: var(--accent2); letter-spacing: 0.02em; text-decoration: none; }
    nav ul { list-style: none; display: flex; gap: 1.5rem; flex-wrap: wrap; }
    nav ul a { color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
    nav ul a:hover { color: var(--white); }

    .error-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 2rem; }
    .error-content { max-width: 600px; text-align: center; }
    .error-code { font-size: clamp(3rem, 10vw, 8rem); font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); color: var(--white); margin-bottom: 1rem; font-weight: 600; }
    p { color: var(--muted); margin-bottom: 1.5rem; font-size: 1.05rem; }
    .btn { display: inline-block; padding: 0.75rem 1.8rem; border-radius: 3px; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: var(--white); margin-right: 1rem; }
    .btn-primary:hover { background: #3a7cf5; }
    .btn-outline { border: 1px solid var(--border); color: var(--muted); }
    .btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }

    footer { background: var(--navy2); border-top: 1px solid var(--border); padding: 1.5rem 2rem; text-align: center; font-size: 0.78rem; color: var(--muted); }

    @media (max-width: 600px) {
      nav ul { gap: 0.8rem; }
      nav ul a { font-size: 0.78rem; }
      .error-container { padding: 2rem 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="brand">TWG&middot;FAS</a>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/#objective">Objective</a></li>
    <li><a href="/faq.html">FAQ</a></li>
    <li><a href="/#contact">Contact</a></li>
  </ul>
</nav>

<div class="error-container">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div>
      <a href="/" class="btn btn-primary">Return to Home</a>
      <a href="/faq.html" class="btn btn-outline">View FAQ</a>
    </div>
  </div>
</div>

<footer>
  <p>&copy; 2026 Technical Working Group for Formal Automotive Systems. All rights reserved.</p>
</footer>

</body>
</html>
